[package]
name = "dsh-wallpaper"
version = "0.3.2"
description = "Interactive DeepSeek desktop wallpaper"
edition = "2021"
rust-version = "1.77.2"
default-run = "dsh-wallpaper"

[features]
default = ["full"]
full = [
  "dep:base64",
  "dep:futures-util",
  "dep:keyring",
  "dep:reqwest",
  "dep:rusqlite",
  "dep:urlencoding",
  "dep:zip",
]
lite = ["dep:base64", "dep:urlencoding"]
# FREEZE（临时冻结，不是删除）：锁屏功能整体退出（2026-09-30），诊断探针随之停用。
# 归档在 archive/lockscreen-20260930/（含脚本与 MSIX 清单）。恢复办法：把那个目录里的
# 三个文件放回原位，并取消下面这几行的注释。
# lockscreen-probe = ["dep:urlencoding"]

# [[bin]]
# name = "lockscreen_probe"
# path = "src/bin/lockscreen_probe.rs"
# required-features = ["lockscreen-probe"]

[lib]
name = "dsh_wallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "6"
keyring = { version = "3", features = ["windows-native"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures-util = { version = "0.3", optional = true }
urlencoding = { version = "2", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
base64 = { version = "0.22", optional = true }
# 锁屏托管图按**内容**命名（同一张素材永远同一个文件名，否则 Windows 的"最近使用的图像"
# 会给同一张图留多个栏位）。两版都要用，所以它不再是 full 专属的可选依赖。
sha2 = "0.10"
zip = { version = "2.2", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "ApplicationModel",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "System_UserProfile",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_System_RemoteDesktop",
  "Win32_System_Registry",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  # `PKEY_AppUserModel_ID` (propsys.h), which is how a shell registration is
  # recognised and how `shell:AppsFolder\<AUMID>` is addressed. The `windows`
  # crate groups the propsys constants under this feature.
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Needed to map a listening TCP port back to the process that owns it, so the
  # wallpaper can raise the window of whichever DSH client the user selected
  # instead of guessing from a stored executable path.
  "Win32_NetworkManagement_IpHelper",
  "Win32_UI_Shell_Common",
  "Win32_Networking_WinSock"
] }

[profile.release]
strip = true

# Keep the Windows single-instance implementation auditable and pinned.  The
# upstream 2.4.3 crate can let a concurrent second launch pass through during
# the short interval between creating its mutex and hidden IPC window, which
# is unacceptable for a resident WorkerW/tray application.
[patch.crates-io]
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance" }
