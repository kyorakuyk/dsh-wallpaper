name: CI

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      # 依赖缓存，key 跟着 lock 文件走；并且**失败也存**。
      #
      # 这一条替代了原来的手写 actions/cache：那个 key 只由 Cargo.lock 决定，而 actions/cache
      # 对已存在的 key 永不重写 —— 于是每个 lock 版本只在第一次成功的那轮存一次；那一轮失败或
      # 被取消，之后每一轮都要把整棵依赖树重新编一遍，直到 lock 再变。实测确认过这个行为。
      #
      # 这个 action 只缓存**依赖**（不缓存本仓库的 crate —— 那部分每轮都会变，缓存它没意义），
      # 并在保存前清掉增量产物与一周前的旧产物，所以恢复/上传都快得多。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # target/ 在清单旁边，不在仓库根目录。
          workspaces: wallpaper/src-tauri
          key: ci
          cache-on-failure: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run frontend and bridge tests
        run: pnpm test

      - name: Run Rust tests
        run: cargo test --manifest-path wallpaper/src-tauri/Cargo.toml --locked --all-targets

      - name: Build frontend
        run: pnpm build

      - name: Build Lite frontend
        run: pnpm build:lite

      - name: Check Lite native target
        run: cargo check --manifest-path wallpaper/src-tauri/Cargo.toml --locked --no-default-features --features lite --bin dsh-wallpaper-lite

      - name: Run Lite native tests
        run: cargo test --manifest-path wallpaper/src-tauri/Cargo.toml --locked --no-default-features --features lite --lib

      - name: Verify Lite bundle boundary
        shell: pwsh
        run: .\scripts\verify-lite-bundle.ps1
