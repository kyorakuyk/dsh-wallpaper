name: Package

on:
  workflow_dispatch:
  # FREEZE（2026-09-30）：标签不再触发本工作流。理由是一次实况：给 v0.3.0 打标签时它自动把
  # 测试签名的 MSIX 与测试证书挂到了公开发布页上，和真正的安装器并排 —— 用户会点到那条需要
  # 先信任证书的路，而那条路我们已经不用了（锁屏退出后不再需要包身份）。
  # 恢复办法：取消下面 push/tags 三行的注释。真要重发 MSIX，用上面的手动触发。
  # push:
  # tags:
  # - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Windows Lite packages
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The first public package is intentionally Lite-only.  The full
        # edition remains in the repository for later work, but must not be
        # accidentally shipped with this release.
        edition: [lite]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: wallpaper/src-tauri
          key: package
          cache-on-failure: true

      # MSIX 辅助脚本用**另一个** target 目录（`artifacts/msix-test/cargo-target`），上一行的
      # action 不可能知道它，所以单独缓存。key 里带 run_id 是有意的：带 run_id 的 key 每次都是新
      # 条目（所以能存），restore-keys 用 lock 哈希前缀去取最近的一份（所以能暖）。
      - name: Cache the isolated MSIX build target
        uses: actions/cache@v4
        with:
          path: artifacts\msix-test\cargo-target
          key: ${{ runner.os }}-msix-target-${{ hashFiles('wallpaper/src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-msix-target-${{ hashFiles('wallpaper/src-tauri/Cargo.lock') }}-
            ${{ runner.os }}-msix-target-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        shell: pwsh
        run: pnpm desktop:build:lite

      - name: Build MSIX lock-screen test package
        shell: pwsh
        run: |
          # The first release must be installable on a separate test PC so
          # that its MSIX identity can exercise the Windows lock-screen API.
          # Generate an ephemeral certificate on the runner, publish only
          # its public .cer, and never upload the private .pfx.
          $bytes = New-Object byte[] 32
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($bytes) } finally { $rng.Dispose() }
          $password = [Convert]::ToBase64String($bytes)
          Write-Output "::add-mask::$password"
          "MSIX_TEST_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          .\scripts\build-msix-test.ps1 -Edition lite -Release -CreateTestCertificate -CertificatePassword $securePassword

      - name: Collect package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\ci-artifacts\nsis" -Force | Out-Null
          $installer = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\wallpaper\src-tauri\target\release\bundle\nsis" -Filter 'dsh-wallpaper*_x64-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw '未找到 Lite NSIS 安装器。' }
          Copy-Item -LiteralPath $installer.FullName -Destination "$env:GITHUB_WORKSPACE\ci-artifacts\nsis\" -Force
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test" -Force | Out-Null
          $msix = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\msix-test" -Filter '*-msix-test.msix' -File | Select-Object -First 1
          if (-not $msix) { throw '未找到 Lite MSIX 测试包。' }
          Copy-Item -LiteralPath $msix.FullName -Destination "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test\" -Force
          $certificate = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\msix-test" -Filter '*.cer' -File | Select-Object -First 1
          if (-not $certificate) { throw 'Lite MSIX 测试包缺少公开签名证书 .cer。' }
          Copy-Item -LiteralPath $certificate.FullName -Destination "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test\" -Force
          Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\msix-test" -Filter '*.pfx' -File | Remove-Item -Force

      - name: Build Lite MSIX test bootstrapper
        shell: pwsh
        run: |
          $msix = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test" -Filter '*-msix-test.msix' -File | Select-Object -First 1
          $certificate = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test" -Filter '*.cer' -File | Select-Object -First 1
          if (-not $msix -or -not $certificate) { throw '构建引导安装器缺少 MSIX 或 CER。' }
          .\scripts\build-msix-test-bootstrapper.ps1 `
            -MsixPath $msix.FullName `
            -CertificatePath $certificate.FullName `
            -OutputPath "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test\dsh-wallpaper-lite-msix-test-setup.exe"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wallpaper-${{ matrix.edition }}-nsis
          path: ci-artifacts/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lite signed MSIX test package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wallpaper-lite-msix-test-signed
          path: ci-artifacts/msix-test/*-msix-test.msix
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lite test publisher certificate
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wallpaper-lite-msix-test-certificate
          path: ci-artifacts/msix-test/*.cer
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lite MSIX test bootstrapper
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wallpaper-lite-msix-test-setup
          path: ci-artifacts/msix-test/*-test-setup.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Lite release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-wallpaper-lite-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --verify-tag --generate-notes
