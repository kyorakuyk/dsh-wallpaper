name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Windows packages
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            wallpaper\src-tauri\target
            artifacts\msix-test\cargo-target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('wallpaper/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-package-
            ${{ runner.os }}-cargo-

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm desktop:build

      - name: Build unsigned MSIX lock-screen test package
        shell: pwsh
        run: .\scripts\build-msix-test.ps1 -Release

      - name: Collect package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\ci-artifacts\nsis" -Force | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\wallpaper\src-tauri\target\release\bundle\nsis\dsh-wallpaper_0.2.0_x64-setup.exe" -Destination "$env:GITHUB_WORKSPACE\ci-artifacts\nsis\" -Force
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test" -Force | Out-Null
          Copy-Item -LiteralPath "$env:GITHUB_WORKSPACE\artifacts\msix-test\dsh-wallpaper-lockscreen-test.msix" -Destination "$env:GITHUB_WORKSPACE\ci-artifacts\msix-test\" -Force

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wallpaper-nsis
          path: ci-artifacts/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned MSIX test package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-wallpaper-msix-test-unsigned
          path: ci-artifacts/msix-test/*.msix
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download NSIS installer
        uses: actions/download-artifact@v4
        with:
          name: dsh-wallpaper-nsis
          path: release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release-assets/*.exe --verify-tag --generate-notes

